<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI Chat Application - Tanya apapun ke AI">
    <meta name="theme-color" content="#667eea">
    <title>AI Chat - Ngobrol Bareng AI 🤖</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 AI Chat</h1>
            <p>Tanya apapun, AI akan jawab! ✨</p>
            <button class="clear-btn" onclick="clearChatHistory()">🗑️ Clear Chat</button>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message ai">
                <div class="message-content">
                    Halo! Aku AI BY MyGilXz  🤖<br>Aku sedang dikembangkan, tanya apapun yang mau dibantu! 😊
                </div>
            </div>
        </div>

        <div class="input-area">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Ketik pertanyaan kamu..."
                onkeypress="handleKeyPress(event)"
                autocomplete="off"
            >
            <button onclick="sendMessage()">Kirim</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
