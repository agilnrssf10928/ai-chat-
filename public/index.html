<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI Chat - Offline/Online Mode dengan Contact Telegram">
    <title>AI Chat - Offline/Online Mode 🤖</title>
    <style>
        /* ===== CSS STYLE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            background: linear-gradient(145deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            margin: 0;
            animation: bgFloat 12s ease-in-out infinite alternate;
        }

        @keyframes bgFloat {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .container {
            width: 100%;
            max-width: 780px;
            height: 92vh;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px);
            border-radius: 32px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(40px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.9), rgba(118, 75, 162, 0.9));
            padding: 20px 24px 16px;
            text-align: center;
            position: relative;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(to right, #fff, #e0e7ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 14px;
            opacity: 0.85;
            color: #e0e7ff;
            margin: 4px 0 10px;
        }

        /* ===== HEADER ACTION BUTTONS ===== */
        .header-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 4px;
            position: relative;
            z-index: 1;
        }

        /* Mode Toggle */
        .mode-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mode-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            font-weight: 600;
        }

        .mode-label.active {
            color: #fff;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #4a4a6a;
            transition: 0.3s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .mode-status {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 20px;
            color: white;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .mode-status.online {
            background: rgba(102, 126, 234, 0.4);
            border-color: #667eea;
        }

        .mode-status.offline {
            background: rgba(255, 165, 0, 0.3);
            border-color: #ffa500;
        }

        /* Tombol Action */
        .action-btn {
            background: rgba(255, 255, 255, 0.12);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        .action-btn.telegram {
            background: rgba(0, 136, 204, 0.3);
            border-color: #0088cc;
        }

        .action-btn.telegram:hover {
            background: rgba(0, 136, 204, 0.5);
            box-shadow: 0 0 20px rgba(0, 136, 204, 0.3);
        }

        .action-btn.clear {
            background: rgba(255, 70, 70, 0.2);
            border-color: rgba(255, 70, 70, 0.3);
        }

        .action-btn.clear:hover {
            background: rgba(255, 70, 70, 0.35);
        }

        /* ===== CHAT BOX ===== */
        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: rgba(0, 0, 0, 0.2);
            scroll-behavior: smooth;
        }

        .chat-box::-webkit-scrollbar {
            width: 6px;
        }
        .chat-box::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 10px;
        }

        /* ===== MESSAGE ===== */
        .message {
            display: flex;
            animation: messagePop 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes messagePop {
            0% { opacity: 0; transform: scale(0.9) translateY(15px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 12px 18px;
            border-radius: 20px 20px 4px 20px;
            max-width: 80%;
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.3);
            font-weight: 500;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .message.ai .message-content {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            color: #f0f0f0;
            padding: 12px 18px;
            border-radius: 20px 20px 20px 4px;
            max-width: 85%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .message-content {
            width: 100%;
            line-height: 1.6;
        }

        .mode-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            margin-right: 6px;
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.6);
        }

        .mode-badge.offline {
            color: #ffa500;
            background: rgba(255, 165, 0, 0.15);
        }

        .mode-badge.online {
            color: #667eea;
            background: rgba(102, 126, 234, 0.15);
        }

        /* ===== INPUT AREA ===== */
        .input-area {
            display: flex;
            gap: 10px;
            padding: 14px 18px 18px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        #userInput {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            font-size: 15px;
            outline: none;
            background: rgba(255, 255, 255, 0.06);
            color: #f0f0f0;
            transition: 0.3s;
        }

        #userInput:focus {
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        #userInput::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .input-area button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.3);
        }

        .input-area button:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 40px rgba(102, 126, 234, 0.4);
        }

        .input-area button:active {
            transform: scale(0.97);
        }

        /* ===== LOADING ===== */
        .loading {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: pulseRing 1.4s ease-in-out infinite;
            margin-right: 8px;
        }

        @keyframes pulseRing {
            0%, 100% { opacity: 0.4; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .container {
                height: 100vh;
                border-radius: 0;
            }
            .header h1 { font-size: 22px; }
            .header-actions { gap: 6px; }
            .mode-toggle { gap: 6px; }
            .mode-label { font-size: 11px; }
            .action-btn { font-size: 11px; padding: 4px 10px; }
            .chat-box { padding: 14px 10px; }
            .input-area { padding: 10px; }
            #userInput { padding: 10px 14px; font-size: 14px; }
            .input-area button { padding: 10px 18px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>💬 AI Chat</h1>
            <p>Tanya apapun, AI siap bantu! ✨</p>

            <!-- HEADER ACTION BUTTONS -->
            <div class="header-actions">
                <!-- Mode Toggle -->
                <div class="mode-toggle">
                    <span class="mode-label" id="labelOffline">📴 Off</span>
                    <label class="switch">
                        <input type="checkbox" id="modeSwitch" onchange="toggleMode()">
                        <span class="slider"></span>
                    </label>
                    <span class="mode-label" id="labelOnline">🌐 On</span>
                </div>

                <span class="mode-status offline" id="modeStatus">Offline</span>

                <!-- TOMBOL TELEGRAM -->
                <a href="https://t.me/GIL_XZ" target="_blank" class="action-btn telegram">
                    📱 Telegram
                </a>

                <button class="action-btn clear" onclick="clearChatHistory()">🗑️ Clear</button>
            </div>
        </div>

        <!-- CHAT BOX -->
        <div class="chat-box" id="chatBox">
            <div class="message ai">
                <div class="message-content">
                    <span class="mode-badge offline">📴 Offline</span>
                    Halo! Aku AI by GIL 🤖<br>
                    Saat ini mode <strong>Offline</strong> — respons instan tanpa internet!<br>
                    Switch ke Online untuk jawaban lebih cerdas 🌐<br><br>
                    📱 <strong>Contact:</strong> <a href="https://t.me/GIL_XZ" target="_blank" style="color: #667eea; text-decoration: none;">@GIL_XZ</a>
                </div>
            </div>
        </div>

        <!-- INPUT AREA -->
        <div class="input-area">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Ketik pertanyaan..."
                onkeypress="handleKeyPress(event)"
                autocomplete="off"
            >
            <button onclick="sendMessage()">Kirim</button>
        </div>
    </div>

    <script>
        // ===== VARIABEL GLOBAL =====
        let isOnline = false; // default offline

        // ===== DATABASE RESPON OFFLINE =====
        const offlineResponses = {
            "hai": "Hai juga! 👋 Ada yang bisa aku bantu? (Offline mode)",
            "halo": "Halo! Senang ketemu kamu! 😊 (Offline mode)",
            "apa kabar": "Aku baik! Gimana kabar kamu? 😄 (Offline mode)",
            "siapa kamu": "Aku AI by GIL, asisten pintar mode offline! 🤖",
            "nama kamu": "Namaku GIL-AI, senang berkenalan! ✨",
            "kamu suka apa": "Aku suka bantu kamu! 🚀 (Offline mode)",
            "bantu": "Tentu! Tanya apa aja, aku bantu jawab 😊 (Offline)",
            "terima kasih": "Sama-sama! Senang bisa bantu! 🙌 (Offline)",
            "thanks": "You're welcome! 😄 (Offline)",
            "makasih": "Makasih juga! Semangat terus! 💪 (Offline)",
            "offline": "Kamu lagi di mode Offline nih. Ketik apa aja, aku jawab instan! 📴",
            "online": "Switch ke Online dulu ya kalau mau akses internet! 🌐",
            "telegram": "Kamu bisa hubungi aku di Telegram: @GIL_XZ 📱 https://t.me/GIL_XZ",
            "contact": "Kontak Telegram: @GIL_XZ 📱 https://t.me/GIL_XZ",
            "default": "Hmm, aku belum tahu jawabannya di mode Offline 😅. Coba tanya yang lain, atau switch ke Online! 🌐"
        };

        // ===== FUNGSI TOGGLE MODE =====
        function toggleMode() {
            const switchInput = document.getElementById('modeSwitch');
            const status = document.getElementById('modeStatus');
            const labelOff = document.getElementById('labelOffline');
            const labelOn = document.getElementById('labelOnline');

            isOnline = switchInput.checked;

            if (isOnline) {
                status.textContent = 'Online 🌐';
                status.className = 'mode-status online';
                labelOff.className = 'mode-label';
                labelOn.className = 'mode-label active';
                addSystemMessage('🌐 Mode Online aktif! AI akan menjawab menggunakan internet (jika terhubung).', 'online');
            } else {
                status.textContent = 'Offline 📴';
                status.className = 'mode-status offline';
                labelOff.className = 'mode-label active';
                labelOn.className = 'mode-label';
                addSystemMessage('📴 Mode Offline aktif! AI akan menjawab instan tanpa internet.', 'offline');
            }
        }

        // ===== FUNGSI KIRIM PESAN =====
        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            // Tampilkan pesan user
            addMessage(text, 'user');
            input.value = '';

            // Tampilkan loading
            const loadingMsg = addMessage('⏳ AI sedang berpikir...', 'ai', true);

            setTimeout(() => {
                loadingMsg.remove();

                if (isOnline) {
                    // ===== MODE ONLINE (PAKAI INTERNET) =====
                    // Ganti dengan API key kamu di sini
                    const apiKey = 'YOUR_OPENAI_API_KEY'; // <-- GANTI INI
                    const url = 'https://api.openai.com/v1/chat/completions';

                    // Cek apakah API key diisi
                    if (apiKey === 'YOUR_OPENAI_API_KEY') {
                        addMessage('⚠️ API key belum diatur. Ganti "YOUR_OPENAI_API_KEY" dengan key OpenAI kamu di script.js', 'ai');
                        return;
                    }

                    fetch(url, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: 'gpt-3.5-turbo',
                            messages: [{ role: 'user', content: text }],
                            max_tokens: 150
                        })
                    })
                    .then(res => res.json())
                    .then(data => {
                        const reply = data.choices?.[0]?.message?.content || 'Maaf, AI lagi error. Coba lagi ya!';
                        addMessage(reply, 'ai');
                    })
                    .catch(() => {
                        addMessage('⚠️ Gagal terhubung ke internet. Cek koneksi atau switch ke Offline mode.', 'ai');
                    });

                } else {
                    // ===== MODE OFFLINE (LOGIKA LOKAL) =====
                    const lower = text.toLowerCase();
                    let reply = offlineResponses.default;

                    // Cari kata kunci
                    for (const [key, value] of Object.entries(offlineResponses)) {
                        if (lower.includes(key)) {
                            reply = value;
                            break;
                        }
                    }

                    addMessage(reply, 'ai');
                }
            }, 800);
        }

        // ===== FUNGSI TAMBAH PESAN =====
        function addMessage(text, sender, isTemp = false) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `message ${sender}`;

            // Mode badge untuk AI
            let badge = '';
            if (sender === 'ai') {
                const mode = isOnline ? 'online' : 'offline';
                const label = isOnline ? '🌐 Online' : '📴 Offline';
                badge = `<span class="mode-badge ${mode}">${label}</span>`;
            }

            div.innerHTML = `<div class="message-content">${badge}${text}</div>`;
            if (isTemp) div.id = 'loading-msg';
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        // ===== FUNGSI SYSTEM MESSAGE =====
        function addSystemMessage(text, mode) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = 'message ai';
            const badge = mode === 'online' ? '🌐 Online' : '📴 Offline';
            div.innerHTML = `
                <div class="message-content" style="background: rgba(255,255,255,0.05); text-align: center; font-size: 13px; opacity: 0.8;">
                    <span class="mode-badge ${mode}">${badge}</span>
                    ${text}
                </div>
            `;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // ===== FUNGSI CLEAR CHAT =====
        function clearChatHistory() {
            const chatBox = document.getElementById('chatBox');
            if (confirm('Yakin mau hapus semua chat? 🤔')) {
                chatBox.innerHTML = '';
                const mode = isOnline ? 'online' : 'offline';
                const msg = isOnline 
                    ? 'Mode Online aktif! Tanya apa aja, AI jawab pakai internet 🌐'
                    : 'Mode Offline aktif! Respons instan tanpa internet 📴';
                addSystemMessage(`🔄 Chat dibersihkan. ${msg}`, mode);
            }
        }

        // ===== FUNGSI ENTER KEY =====
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
